name: Deploy Lambda Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'lambda/**'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:  # Allow manual triggers

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    name: Deploy ${{ matrix.lambda.name }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        lambda:
          - name: AI Gateway
            function_name: covalent-ai-gateway
            handler_file: ai-gateway.py
            # ai-gateway imports this module; must ship beside the handler in package/
            extra_files: budget_metadata.py
          - name: Perplexity Gateway
            function_name: covalent-perplexity-gateway
            handler_file: perplexity-gateway.py
            # perplexity-gateway imports this module; must ship beside the handler in package/
            extra_files: budget_metadata.py
    
    permissions:
      id-token: write   # Required for OIDC
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Use OIDC for secure, keyless authentication (recommended)
          # Or use access keys by setting AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # Fallback to access keys if OIDC role not configured
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install with manylinux wheels for Amazon Linux 2 compatibility
          pip install -r lambda/requirements.txt -t lambda/package/ \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade
      
      - name: Package Lambda (${{ matrix.lambda.name }})
        run: |
          cd lambda
          # Copy the handler for this specific Lambda
          cp ${{ matrix.lambda.handler_file }} package/
          # Optional companion modules (e.g. ai-gateway -> budget_metadata)
          if [ -n "${{ matrix.lambda.extra_files }}" ]; then
            cp ${{ matrix.lambda.extra_files }} package/
          fi
          # Create deployment package
          cd package
          zip -r ../deployment-${{ matrix.lambda.function_name }}.zip .
          cd ..
          echo "Deployment package size: $(du -h deployment-${{ matrix.lambda.function_name }}.zip | cut -f1)"
      
      - name: Deploy ${{ matrix.lambda.name }} to AWS Lambda
        run: |
          FUNCTION_NAME="${{ matrix.lambda.function_name }}"
          HANDLER_FILE="${{ matrix.lambda.handler_file }}"
          HANDLER_NAME="${HANDLER_FILE%.py}.lambda_handler"
          
          # Check if function exists
          if aws lambda get-function --function-name $FUNCTION_NAME 2>/dev/null; then
            echo "Updating existing function: $FUNCTION_NAME"
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --zip-file fileb://lambda/deployment-$FUNCTION_NAME.zip \
              --publish
          else
            echo "Function $FUNCTION_NAME doesn't exist. Please create it first via Terraform."
            echo "Required configuration:"
            echo "  - Runtime: python3.11"
            echo "  - Handler: $HANDLER_NAME"
            echo "  - Memory: 256 MB (minimum)"
            echo "  - Timeout: 60 seconds (minimum)"
            exit 1
          fi
      
      - name: Wait for update to complete
        run: |
          echo "Waiting for ${{ matrix.lambda.function_name }} update to complete..."
          aws lambda wait function-updated \
            --function-name ${{ matrix.lambda.function_name }}
          echo "${{ matrix.lambda.name }} updated successfully!"
      
      - name: Get function info
        run: |
          aws lambda get-function \
            --function-name ${{ matrix.lambda.function_name }} \
            --query 'Configuration.{Version:Version,LastModified:LastModified,State:State}' \
            --output table
