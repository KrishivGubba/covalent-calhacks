name: Deploy AI Gateway Lambda

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'lambda/**'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:  # Allow manual triggers

env:
  AWS_REGION: us-west-2
  LAMBDA_FUNCTION_NAME: covalent-ai-gateway
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write   # Required for OIDC
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Use OIDC for secure, keyless authentication (recommended)
          # Or use access keys by setting AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # Fallback to access keys if OIDC role not configured
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt -t lambda/package/
      
      - name: Package Lambda
        run: |
          cd lambda
          # Copy the handler
          cp ai-gateway.py package/
          # Create deployment package
          cd package
          zip -r ../deployment.zip .
          cd ..
          echo "Deployment package size: $(du -h deployment.zip | cut -f1)"
      
      - name: Deploy to AWS Lambda
        run: |
          # Check if function exists
          if aws lambda get-function --function-name ${{ env.LAMBDA_FUNCTION_NAME }} 2>/dev/null; then
            echo "Updating existing function..."
            aws lambda update-function-code \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --zip-file fileb://lambda/deployment.zip \
              --publish
          else
            echo "Function doesn't exist. Please create it first via Terraform/CloudFormation or manually."
            echo "Required configuration:"
            echo "  - Runtime: python3.11"
            echo "  - Handler: ai-gateway.lambda_handler"
            echo "  - Memory: 256 MB (minimum)"
            echo "  - Timeout: 30 seconds (minimum)"
            echo "  - IAM Role with Bedrock permissions"
            exit 1
          fi
      
      - name: Wait for update to complete
        run: |
          echo "Waiting for function update to complete..."
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}
          echo "Function updated successfully!"
      
      - name: Get function info
        run: |
          aws lambda get-function \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --query 'Configuration.{Version:Version,LastModified:LastModified,State:State}' \
            --output table
