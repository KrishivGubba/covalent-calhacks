name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  build-servers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Build server binaries
        run: bash build_servers.sh

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: servers-aarch64-apple-darwin
          path: dist-servers/
          retention-days: 1

  build-tauri:
    needs: build-servers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: servers-aarch64-apple-darwin
          path: dist-servers/

      - name: Restore executable permissions on server binaries
        run: |
          chmod +x dist-servers/flask-server/flask-server
          chmod +x dist-servers/mcp-server/mcp-server

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Import certificate from secrets
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Fix Python.framework for code signing
        run: |
          echo "=== Fixing Python.framework for notarization ==="
          # PyInstaller's Python.framework has symlinks and existing signatures that break notarization.
          # We must: 1) Remove old _CodeSignature dirs, 2) Replace symlinks with real files,
          # 3) Strip existing signatures so we can re-sign fresh.
          
          find dist-servers -type d -name "Python.framework" | while read -r framework; do
            echo "Processing framework: $framework"
            
            # Step 1: Remove ALL _CodeSignature directories (they contain stale signatures)
            echo "  Removing _CodeSignature directories..."
            find "$framework" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
            
            # Step 2: Find the actual Python binary
            actual_binary=""
            for vdir in "$framework/Versions"/*/; do
              if [ -f "${vdir}Python" ] && [ ! -L "${vdir}Python" ]; then
                actual_binary="${vdir}Python"
                break
              fi
            done
            
            if [ -z "$actual_binary" ]; then
              echo "  Warning: Could not find actual Python binary, skipping"
              continue
            fi
            echo "  Found actual binary: $actual_binary"
            
            # Step 3: Strip existing signature from the actual binary
            echo "  Stripping existing signature from actual binary..."
            codesign --remove-signature "$actual_binary" 2>/dev/null || true
            
            # Step 4: Replace Versions/Current (symlink or whatever) with a real directory + binary
            echo "  Ensuring Versions/Current/Python exists as real file..."
            rm -rf "$framework/Versions/Current" 2>/dev/null || true
            mkdir -p "$framework/Versions/Current"
            cp "$actual_binary" "$framework/Versions/Current/Python"
            
            # Step 5: Replace top-level Python (symlink or whatever) with a real binary
            echo "  Ensuring Python.framework/Python exists as real file..."
            rm -f "$framework/Python" 2>/dev/null || true
            rm -rf "$framework/Python" 2>/dev/null || true  # In case it's a dir
            cp "$actual_binary" "$framework/Python"
            
            # Step 6: Also strip signatures from the copies we just made
            codesign --remove-signature "$framework/Versions/Current/Python" 2>/dev/null || true
            codesign --remove-signature "$framework/Python" 2>/dev/null || true
            
            echo "  Framework fixed successfully"
          done
          
          # Also remove any _CodeSignature directories elsewhere in dist-servers
          echo "=== Removing all remaining _CodeSignature directories ==="
          find dist-servers -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          
          # Strip signatures from ALL Mach-O binaries so we sign fresh
          echo "=== Stripping all existing signatures ==="
          find dist-servers -type f | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              codesign --remove-signature "$file" 2>/dev/null || true
            fi
          done
          
          echo "=== Framework fixing complete ==="

      - name: Sign server binaries for notarization
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "Signing server binaries with identity: $APPLE_SIGNING_IDENTITY"
          
          # Sign ALL Mach-O binaries found anywhere in dist-servers
          # This includes dylibs, .so files, and executables (with or without extensions)
          # We use 'file' command to identify actual Mach-O binaries
          
          echo "=== Finding and signing all Mach-O binaries ==="
          find dist-servers -type f | while read -r file; do
            # Check if it's a Mach-O binary (executable, dylib, or bundle)
            if file "$file" | grep -q "Mach-O"; then
              echo "Signing: $file"
              codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$file" || {
                echo "Warning: Failed to sign $file"
              }
            fi
          done
          
          # Re-sign the main server executables last to ensure they're properly signed
          # after all their dependencies
          echo "=== Re-signing main executables ==="
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" dist-servers/flask-server/flask-server
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" dist-servers/mcp-server/mcp-server
          
          echo "=== Server binary signing complete ==="
          
          # Verify signatures on main executables
          echo "=== Verifying signatures ==="
          codesign --verify --verbose dist-servers/flask-server/flask-server
          codesign --verify --verbose dist-servers/mcp-server/mcp-server
          
          # List all signed binaries for debugging
          echo "=== Signed binary count ==="
          find dist-servers -type f -exec sh -c 'file "$1" | grep -q "Mach-O" && echo "$1"' _ {} \; | wc -l

      - name: Generate .env for bundled servers
        env:
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          NOTION_CLIENT_ID: ${{ secrets.VITE_NOTION_CLIENT_ID }}
          VITE_NOTION_CLIENT_ID: ${{ secrets.VITE_NOTION_CLIENT_ID }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          PERPLEXITY_GATEWAY_URL: ${{ secrets.PERPLEXITY_GATEWAY_URL }}
          MCP_PORT: ${{ secrets.MCP_PORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          env | grep -E '^(VITE_|GOOGLE_|GITHUB_|NOTION_|GATEWAY_|PERPLEXITY_|MCP_PORT|ANTHROPIC_|CLAUDE_)' > .env
          echo "Generated .env with $(wc -l < .env) entries"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_NOTION_CLIENT_ID: ${{ secrets.VITE_NOTION_CLIENT_ID }}
          # Apple code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Apple notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Covalent v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 5,
            });
            const draft = releases.find(r => r.draft && r.tag_name === context.ref.replace('refs/tags/', ''));
            if (draft) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draft.id,
                draft: false,
              });
              console.log(`Published release: ${draft.html_url}`);
            }
