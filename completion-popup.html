<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Completion Popup</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 8px;
      }
      
      .popup {
        background-color: rgba(30, 30, 30, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
      }
      
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      
      .badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #888;
        font-weight: 600;
      }
      
      .logo {
        width: 16px;
        height: 16px;
        object-fit: contain;
      }
      
      .confidence {
        font-size: 10px;
        color: #666;
      }
      
      .text {
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 12px;
        white-space: pre-wrap;
        padding: 10px;
        background-color: rgba(42, 42, 42, 0.8);
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-height: 120px;
        overflow-y: auto;
      }
      
      .hint {
        font-size: 10px;
        color: #666;
        text-align: center;
      }
      
      .kbd {
        background-color: #333;
        color: #fff;
        padding: 2px 5px;
        border-radius: 3px;
        font-size: 9px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        border: 1px solid #444;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <div class="header">
        <span class="badge" id="badge">
          <img src="/icon.png" alt="Covalent" class="logo" />
          <span id="badge-text">Suggestion</span>
        </span>
        <span class="confidence" id="confidence">...</span>
      </div>
      
      <div class="text" id="text">Generating suggestion...</div>
      
      <div class="hint">
        <kbd class="kbd">Tab</kbd> to accept · <kbd class="kbd">Esc</kbd> to dismiss
      </div>
    </div>
    
    <script type="module">
      const badgeTextEl = document.getElementById('badge-text');
      const confidenceEl = document.getElementById('confidence');
      const textEl = document.getElementById('text');

      function getBadgeText(level) {
        switch (level) {
          case 'L0-exact':
            return 'Cached (3ms)';
          case 'L1-llm':
            return 'Context (110ms)';
          case 'L2-graph':
            return 'Graph (130ms)';
          case 'L3-fallback':
            return 'New (155ms)';
          default:
            return 'Suggestion';
        }
      }

      function updatePopup(payload) {
        console.log('📬 Popup received update:', payload);
        const { text, confidence, cache_level } = payload;

        if (textEl && text) {
          textEl.textContent = text;
        }

        if (confidenceEl && confidence !== undefined) {
          const confPercent = Math.round(confidence * 100);
          confidenceEl.textContent = `${confPercent}% confident`;
        }

        if (badgeTextEl && cache_level) {
          badgeTextEl.textContent = getBadgeText(cache_level);
        }
      }

      // Set up listener with retry logic for both methods
      async function setupListener() {
        let listenerSet = false;

        // Method 1: Try dynamic import of @tauri-apps/api/event
        try {
          const { listen } = await import('@tauri-apps/api/event');
          await listen('update-completion-popup', (event) => {
            updatePopup(event.payload);
          });
          console.log('✅ Popup listener ready (dynamic import)');
          listenerSet = true;
        } catch (e) {
          console.log('Dynamic import failed, trying __TAURI__:', e.message);
        }

        // Method 2: Try window.__TAURI__ if available
        if (!listenerSet && window.__TAURI__ && window.__TAURI__.event) {
          try {
            await window.__TAURI__.event.listen('update-completion-popup', (event) => {
              updatePopup(event.payload);
            });
            console.log('✅ Popup listener ready (__TAURI__)');
            listenerSet = true;
          } catch (e) {
            console.log('__TAURI__ listener failed:', e.message);
          }
        }

        // Retry if neither method worked
        if (!listenerSet) {
          console.log('Retrying listener setup in 100ms...');
          setTimeout(setupListener, 100);
        }
      }

      // Start setup when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupListener);
      } else {
        setupListener();
      }
    </script>
  </body>
</html>
